name: Build static packager (Alpine)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.20

    steps:
      # ── system deps (Alpine's gcc already links musl) ──
      - name: Install build tools
        run: |
          apk add --no-cache \
            build-base cmake ninja git python3 curl bash

      # ── source code ────────────────────────────────────
      - name: Checkout (with fix)
        uses: actions/checkout@v4
        with:
          ref: b540ed842fbb309537065e2c20535d7ac3f68fbf
          submodules: recursive

      # ── configure ──────────────────────────────────────
      - name: CMake configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      # ── build ──────────────────────────────────────────
      - name: CMake build
        run: cmake --build build --parallel "$(nproc)"

      # ── sanity check ──────────────────────────────────
      - name: Verify binary
        run: |
          BIN="$(find build -name packager -type f -executable | head -1)"
          echo "Binary: $BIN"
          file "$BIN"
          ldd "$BIN" 2>&1 || true
          "$BIN" --version || true

      # ── upload ─────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packager-linux-x64-static
          path: build/packager/packager
          if-no-files-found: error
