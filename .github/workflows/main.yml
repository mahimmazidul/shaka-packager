name: Build static packager (Alpine)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.20

    steps:
      - name: Install build tools
        run: |
          apk add --no-cache \
            build-base cmake ninja git python3 curl bash \
            linux-headers

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Tag for version string
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f v3.10.0-mahim

      - name: CMake configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: CMake build
        run: cmake --build build --parallel "$(nproc)"

      - name: Verify binary
        run: |
          BIN="$(find build -name packager -type f -executable | head -1)"
          echo "Binary: $BIN"
          file "$BIN"
          ldd "$BIN" 2>&1 || true
          "$BIN" --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packager-linux-x64-static
          path: build/packager/packager
          if-no-files-found: error
